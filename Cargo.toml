[package]
name = "sysaud"
version = "0.1.0"
edition = "2021"
description = "Linux system event sound and notification daemon"
license = "MIT"
repository = "https://github.com/anisthdev/sysaud"
authors = ["asif"]
homepage = "https://github.com/anisthdev/sysaud"

[dependencies]
tokio = { version = "1", features = ["full"] }
zbus = "4"
zvariant = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
once_cell = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
chrono = "0.4"
which = "6"
serde_json = "1"
toml = "0.8"
futures-util = "0.3"
udev = "0.9"
mio = "1"
parking_lot = "0.12"
nix = "0.29"
libc = "0.2"
